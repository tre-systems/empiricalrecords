    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
        <img src="" alt="Full size image">
    </div>

    <div id="player" class="player" aria-hidden="true" inert>
        <div class="player-track" aria-live="polite">
            <span id="player-artist" class="player-artist"></span>
            <span id="player-title" class="player-title"></span>
        </div>
        <div class="player-controls">
            <button id="player-prev" class="player-btn" title="Previous" aria-label="Previous track">&#9664;&#9664;</button>
            <button id="player-play" class="player-btn player-btn-main" title="Play" aria-label="Play" aria-pressed="false">&#9654;</button>
            <button id="player-next" class="player-btn" title="Next" aria-label="Next track">&#9654;&#9654;</button>
        </div>
        <div class="player-progress-wrap" id="player-progress-wrap" tabindex="0" role="slider" aria-label="Seek position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="player-progress" id="player-progress"></div>
        </div>
        <div class="player-time">
            <span id="player-current">0:00</span>
            <span id="player-duration">0:00</span>
        </div>
        <div class="player-volume-wrap">
            <input type="range" id="player-volume" min="0" max="1" step="0.01" value="0.8" class="player-volume" aria-label="Volume">
        </div>
    </div>
